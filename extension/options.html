<!doctype html>
<html lang="ro">
<head><meta charset="utf-8"><title>AgencyIntel – setări extensie</title>
<style>
  body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:520px;margin:40px auto;color:#0f172a}
  label{display:block;margin:14px 0 4px;font-weight:600}
  input{width:100%;box-sizing:border-box;font:inherit;padding:8px;border:1px solid #cbd5e1;border-radius:8px}
  button{margin-top:16px;font:600 14px inherit;background:#2563eb;color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
  .muted{color:#64748b;font-size:13px}
</style></head>
<body>
<h2>AgencyIntel – setări extensie</h2>
<p class="muted">Extensia citește datele din backend-ul tău AgencyIntel (pornit pe acest calculator).</p>
<label for="apiUrl">Adresa backend-ului</label>
<input id="apiUrl" placeholder="http://127.0.0.1:8000">
<label for="apiKey">Cheia extensiei</label>
<input id="apiKey" placeholder="aceeași valoare ca EXTENSION_API_KEY din backend/.env">
<button id="save">Salvează și testează</button>
<p id="msg" class="muted"></p>
<script src="options.js"></script>
</body></html>
